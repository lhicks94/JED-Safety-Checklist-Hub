<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JE Dunn Safety Checklists</title>
<style>
:root{--brand:#004b8d;--brand-dark:#003765;--accent:#f4b000;--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#d1d5db;--danger:#b91c1c;--success:#047857;--shadow:0 10px 30px rgba(17,24,39,.12)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:linear-gradient(180deg,#eef3f8 0%,var(--bg) 100%);min-height:100vh}header{background:var(--brand);color:#fff;padding:22px 16px;text-align:center;border-bottom:5px solid var(--accent)}header h1{margin:0;font-size:clamp(1.45rem,5vw,2.2rem);letter-spacing:.02em;font-weight:800}header p{margin:8px 0 0;font-size:.98rem;opacity:.92}main{width:min(960px,100%);margin:0 auto;padding:18px 14px 44px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin:16px 0}.hub-title{margin:0 0 10px;font-size:1.32rem;font-weight:800}.helper{color:var(--muted);margin:0 0 16px;line-height:1.45;font-size:.96rem}.checklist-list{display:grid;gap:12px}.checklist-button{width:100%;border:2px solid transparent;background:#fff;color:var(--brand-dark);border-radius:16px;padding:18px 16px;text-align:left;font-size:1.05rem;font-weight:800;min-height:62px;box-shadow:0 4px 14px rgba(0,75,141,.12);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.checklist-button:active{transform:scale(.99)}.checklist-button:hover{border-color:var(--brand);background:#f8fbff}.chevron{color:var(--accent);font-size:1.25rem}.hidden{display:none!important}.top-actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.back-btn,.secondary-btn{border:1px solid var(--border);background:#fff;color:var(--brand-dark);padding:12px 14px;border-radius:12px;font-weight:800;cursor:pointer}.form-title{margin:0;font-size:1.35rem;font-weight:900;color:var(--brand-dark)}.section{border-top:1px solid var(--border);padding-top:18px;margin-top:18px}.section h3{margin:0 0 12px;font-size:1.08rem;color:var(--brand-dark)}label{display:block;font-weight:800;margin:14px 0 6px}.required:after{content:' *';color:var(--danger)}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:13px 12px;font-size:1rem;background:#fff}textarea{min-height:108px;resize:vertical}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.grid-two{grid-template-columns:1fr}.card{border-radius:16px;padding:15px}.top-actions{align-items:flex-start;flex-direction:column}.back-btn,.secondary-btn{width:100%}}.item{border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0;background:#fbfdff}.item-text{font-weight:800;margin-bottom:10px;line-height:1.35}.radio-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.radio-option{border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;background:#fff;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}.radio-option input{display:none}.radio-option:has(input:checked){border-color:var(--brand);background:#eaf4ff;color:var(--brand-dark)}.radio-option.danger:has(input:checked){border-color:var(--danger);background:#fee2e2;color:#7f1d1d}.notice{border-left:5px solid var(--accent);background:#fff8e1;padding:12px;border-radius:10px;font-weight:700;color:#6b4e00;margin:12px 0;line-height:1.4}.error-box{border-left:5px solid var(--danger);background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:10px;font-weight:800;margin:12px 0}.success-box{border-left:5px solid var(--success);background:#d1fae5;color:#064e3b;padding:14px;border-radius:10px;font-weight:800;margin:12px 0;line-height:1.45}.submit-btn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:16px;padding:16px;font-size:1.08rem;font-weight:900;cursor:pointer;margin-top:18px;box-shadow:0 8px 16px rgba(0,75,141,.22)}.submit-btn:hover{background:var(--brand-dark)}.photo-note{font-size:.92rem;color:var(--muted);margin-top:6px;line-height:1.4}footer{text-align:center;color:var(--muted);font-size:.82rem;padding:16px}
</style>
</head>
<body>
<header><h1>JE Dunn Safety Checklists</h1><p>Select the checklist needed for the task. Complete the form and submit.</p></header>
<main>
<section id="hub" class="card"><h2 class="hub-title">Select a Checklist</h2><p class="helper">Use this page for field checklist entry only. Submitted record access is not available from this public page.</p><div id="checklistList" class="checklist-list"></div></section>
<section id="formCard" class="card hidden"><div class="top-actions"><button class="back-btn" type="button" onclick="showHub()">Back to Checklist List</button><button class="secondary-btn" type="button" onclick="resetCurrentForm()">Reset Form</button></div><h2 id="formTitle" class="form-title"></h2><div id="formContainer"></div></section>
</main><footer>JE Dunn Safety Checklist Hub</footer>
<script>
const SUBMISSION_ENDPOINT = "";
const companies = ["E&K", "Flynn", "IWR", "JE Dunn", "Metro Air", "PCI Metro", "Shaw Electric", "Site Rite", "Other"];
const checklistData = [
{id:"aerial-scissor-lift-inspection",title:"Aerial / Scissor Lift Inspection",intro:"Daily pre-use inspection for aerial lifts and scissor lifts.",fields:[f("liftType","Lift Type"),f("equipmentNumber","Equipment Number"),f("hours","Hours",false),f("inspector","Inspector Name")],items:["Operator manual is present and readable","Annual inspection decal or documentation is current","Platform, guardrails, gate, and toe boards are in acceptable condition","Controls operate properly from platform and ground station","Emergency lowering system is functional","Tires, wheels, outriggers, and base are in acceptable condition","Hydraulic lines, cylinders, and fittings show no visible leaks or damage","Warning lights, alarms, horn, and safety devices are functional","Fall protection anchorage points are present where required","Work area is suitable for lift operation"]},
{id:"confined-space-entry-checklist",title:"Confined Space Entry Checklist",intro:"Verification checklist for non-permit confined space entry activities.",fields:[f("jobsite","Jobsite"),f("jobSupervisor","Job Supervisor"),f("equipment","Equipment / Space to be Worked On"),f("workDescription","Work to be Performed",true,"textarea")],items:["Atmospheric testing has been completed before entry","Atmospheric testing results are acceptable for entry","Space has been isolated from hazardous energy or materials","Ventilation is provided where needed","Entrants have reviewed the work and hazards before entry","Required entry equipment is available","Access and egress are clear and maintained","Communication method is established","Rescue or emergency procedure has been reviewed"]},
{id:"excavation-checklist",title:"Excavation Checklist",intro:"Competent person excavation inspection.",fields:[f("projectName","Project Name"),f("competentPerson","Competent Person"),f("excavationContractor","Excavation Contractor"),f("excavationDepth","Excavation Depth"),f("soilType","Soil Type / Classification")],items:["Utilities have been located and marked","Overhead power line hazards have been identified and controlled","Competent person has inspected the excavation before work begins","Soil classification has been completed","Protective system is in place where required","Spoil piles are kept at least 2 feet from the excavation edge","Safe access and egress is provided within 25 feet of workers","Water accumulation is controlled","Barricades or warning systems are installed where required","Adjacent structures or surfaces are protected from instability"]},
{id:"floor-cover-protection-removal-permit",title:"Floor Cover Protection Removal Permit",intro:"Permit for temporary removal or modification of floor covers or protection.",fields:[f("location","Location Description"),f("foreman","Foreman / Person Requesting Removal"),f("startTime","Start Time",true,"time"),f("endTime","End Time",true,"time"),f("workReason","Reason for Removal / Modification",true,"textarea")],items:["Removal or modification need has been reviewed","Alternate fall protection method is identified","Area below or around opening is protected from exposure","Affected employees have been informed of the removal activity","Opening will remain attended or protected during the work","Cover or protection will be restored before leaving the area","Superintendent or authorized approval has been obtained where required"]},
{id:"floor-hole-opening-inspection",title:"Floor Hole & Opening Inspection",intro:"Inspection of floor holes, covers, openings, markings, and protection.",fields:[f("areaFloor","Area / Floor"),f("inspector","Inspector Name")],notice:"Photo upload is mandatory if any item is marked Non-Compliant.",items:["Floor holes and openings are identified","Openings greater than 1 inch are protected","Covers completely cover the opening","Covers appear capable of supporting intended loads","Covers are secured against displacement","Covers are not damaged or deteriorated","Covers are high visibility or clearly marked","Covers are labeled HOLE COVER DO NOT REMOVE where required","Openings greater than 1 ft x 1 ft are mechanically secured where required","Large openings are guarded or otherwise protected from fall exposure","Required floor cover removal permit is in place when applicable","Housekeeping around the opening is acceptable"]},
{id:"general-safety-observation",title:"General Safety Observation",type:"observation",intro:"Anonymous field observation focused on a quick safety check and one observation.",fields:[],quickCheck:["Housekeeping is acceptable","Required PPE is being worn","Fall protection is being used where required","Access and egress routes are maintained","Materials are stored safely","Tools and equipment appear safe","Work activity is being performed safely"],observationTypes:["Positive Observation","Unsafe Condition","Unsafe Act","Near Miss"]},
{id:"hot-work-permit",title:"Hot Work Permit",intro:"Permit for welding, cutting, grinding, torch work, or other hot work activities.",fields:[f("location","Work Location"),f("worker","Worker Performing Task"),f("natureOfJob","Nature of Job",true,"textarea"),f("permitStart","Permit Start Time",true,"time"),f("permitExpiration","Permit Expiration Time",true,"time")],items:["Combustibles within 35 feet have been removed or protected","Fire extinguisher is available in the work area","Fire watch is assigned where required","Floors and surfaces are protected from sparks or slag","Openings in walls, floors, or ducts are protected","Hot work equipment is in acceptable condition","Area has been inspected before hot work begins","Permit duration and expiration have been communicated"]},
{id:"large-equipment-inspection",title:"Large Equipment Inspection",intro:"Daily large equipment inspection for forklifts, telehandlers, skid loaders, excavators, and similar equipment.",fields:[f("equipmentType","Equipment Type"),f("equipmentNumber","Equipment Number"),f("hours","Hours",false),f("inspector","Inspector Name")],items:["Seat belt is present and functional where equipped","Backup alarm, horn, lights, and warning devices are functional","Brakes and steering operate properly","Tires or tracks are in acceptable condition","Hydraulic lines, cylinders, and fittings show no visible leaks or damage","Forks, attachments, bucket, or boom are in acceptable condition","Mirrors, glass, steps, and handholds are in acceptable condition","Fire extinguisher is present and charged where required","Fluids appear acceptable with no obvious leaks","Equipment is clean enough for safe operation"]},
{id:"overhead-protection-entry-permit",title:"Overhead Protection Entry Permit",intro:"Permit for controlled entry into areas requiring overhead protection or fall zone controls.",fields:[f("entryLocation","Entry Location"),f("workDescription","Work Description",true,"textarea"),f("authorizedPerson","Authorized Person")],items:["Overhead hazard or fall zone has been identified","Controlled access area is established","Workers entering the area have been briefed","Required overhead protection is in place","Barricades, signage, or access controls are in place","Work above has been coordinated or paused where required","Entry is limited to authorized personnel","Area will be restored or closed out after work is complete"]},
{id:"silica-exposure-control-plan",title:"Silica Exposure Control Plan",intro:"Field verification for silica-producing work and use of exposure controls.",fields:[f("task","Silica-Producing Task"),f("location","Work Location"),f("supervisor","Supervisor / Foreman")],items:["Silica-producing task has been identified","Exposure control method has been selected","Water delivery or dust collection controls are in use where required","Respiratory protection is used where required","Affected workers have reviewed the control method","Housekeeping method minimizes airborne dust","Restricted or controlled area is established where needed","Tools and equipment are set up to limit dust release"]}
];
function f(id,label,required=true,type="text"){return{id,label,required,type}}
let currentChecklist=null;
function todayValue(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function initHub(){const list=document.getElementById('checklistList');list.innerHTML='';checklistData.slice().sort((a,b)=>a.title.localeCompare(b.title)).forEach(item=>{const btn=document.createElement('button');btn.className='checklist-button';btn.type='button';btn.innerHTML=`<span>${item.title}</span><span class="chevron">›</span>`;btn.onclick=()=>openChecklist(item.id);list.appendChild(btn)})}
function showHub(){document.getElementById('hub').classList.remove('hidden');document.getElementById('formCard').classList.add('hidden');scrollTo({top:0,behavior:'smooth'})}
function openChecklist(id){currentChecklist=checklistData.find(c=>c.id===id);document.getElementById('hub').classList.add('hidden');document.getElementById('formCard').classList.remove('hidden');document.getElementById('formTitle').textContent=currentChecklist.title;renderForm(currentChecklist);scrollTo({top:0,behavior:'smooth'})}
function resetCurrentForm(){if(currentChecklist)renderForm(currentChecklist)}
function makeField(field){if(field.type==='textarea')return `<label for="${field.id}" class="${field.required?'required':''}">${field.label}</label><textarea id="${field.id}" name="${field.id}" ${field.required?'required':''}></textarea>`;return `<label for="${field.id}" class="${field.required?'required':''}">${field.label}</label><input id="${field.id}" name="${field.id}" type="${field.type||'text'}" ${field.required?'required':''}/>`}
function renderForm(config){const custom=(config.fields||[]).map(makeField).join('');const body=config.type==='observation'?renderObservationForm(config):renderChecklistItems(config.items||[]);document.getElementById('formContainer').innerHTML=`<form id="activeForm" onsubmit="handleSubmit(event)"><p class="helper">${config.intro||''}</p><div class="section"><h3>General Information</h3><div class="grid-two"><div><label for="date" class="required">Date</label><input id="date" name="date" type="date" value="${todayValue()}" required></div><div><label for="company" class="required">Company / Trade Partner</label><select id="company" name="company" required onchange="toggleOtherCompany()"><option value="">Select Company</option>${companies.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div></div><div id="otherCompanyWrap" class="hidden"><label for="otherCompany" class="required">Enter Company Name</label><input id="otherCompany" name="otherCompany" type="text"></div>${custom}</div>${body}<div id="findingSection" class="section hidden"><h3>Deficiency / Corrective Action</h3><div class="notice">A corrective action and at least one photo are required because this submission includes a negative finding.</div><label for="correctiveAction" class="required">Corrective Action or Prevention Feedback</label><textarea id="correctiveAction" name="correctiveAction" placeholder="Briefly describe what should be done to correct or prevent this issue."></textarea></div><div class="section"><h3>Photos</h3><label for="photos">Upload or Take Photo</label><input id="photos" name="photos" type="file" accept="image/*" multiple><p class="photo-note">Photos are optional unless a Non-Compliant, Unsafe Condition, Unsafe Act, or Near Miss response is selected.</p></div><div id="formErrors" class="error-box hidden"></div><div id="formSuccess" class="success-box hidden"></div><button class="submit-btn" type="submit">Submit Checklist</button></form>`;attachResponseListeners();updateFindingLogic()}
function renderChecklistItems(items){return `<div class="section"><h3>Checklist Items</h3>${currentChecklist.notice?`<div class="notice">${currentChecklist.notice}</div>`:''}${items.map((text,idx)=>makeComplianceItem(text,idx)).join('')}</div>`}
function makeComplianceItem(text,idx){const name=`item_${idx}`;return `<div class="item"><div class="item-text">${idx+1}. ${text}</div><div class="radio-row"><label class="radio-option"><input type="radio" name="${name}" value="Compliant" required>Compliant</label><label class="radio-option danger"><input type="radio" name="${name}" value="Non-Compliant" required>Non-Compliant</label><label class="radio-option"><input type="radio" name="${name}" value="N/A" required>N/A</label></div></div>`}
function renderObservationForm(config){return `<div class="section"><h3>Quick Safety Check</h3>${config.quickCheck.map((text,idx)=>makeComplianceItem(text,idx)).join('')}</div><div class="section"><h3>Observation</h3><label class="required">Observation Type</label><div class="radio-row">${config.observationTypes.map(type=>`<label class="radio-option ${type==='Positive Observation'?'':'danger'}"><input type="radio" name="observationType" value="${type}" required>${type}</label>`).join('')}</div><label for="observationDescription" class="required">Briefly Describe What You Observed</label><textarea id="observationDescription" name="observationDescription" required placeholder="Describe one observation from the work area."></textarea></div>`}
function toggleOtherCompany(){const c=document.getElementById('company'),w=document.getElementById('otherCompanyWrap'),o=document.getElementById('otherCompany');if(c.value==='Other'){w.classList.remove('hidden');o.required=true}else{w.classList.add('hidden');o.required=false;o.value=''}}
function attachResponseListeners(){document.querySelectorAll('#activeForm input[type="radio"]').forEach(i=>i.addEventListener('change',updateFindingLogic))}
function hasNegativeFinding(){return Array.from(document.querySelectorAll('#activeForm input[type="radio"]:checked')).some(i=>['Non-Compliant','Unsafe Condition','Unsafe Act','Near Miss'].includes(i.value))}
function updateFindingLogic(){const finding=hasNegativeFinding(),section=document.getElementById('findingSection'),corrective=document.getElementById('correctiveAction'),photos=document.getElementById('photos');if(!section||!corrective||!photos)return;if(finding){section.classList.remove('hidden');corrective.required=true;photos.required=true}else{section.classList.add('hidden');corrective.required=false;photos.required=false;corrective.value=''}}
function collectFormData(form){const data={checklistId:currentChecklist.id,checklistTitle:currentChecklist.title,submittedAt:new Date().toISOString(),fields:{},responses:[],fileCount:0};const fd=new FormData(form);for(const [key,value] of fd.entries()){if(key==='photos')continue;if(key.startsWith('item_')){const idx=parseInt(key.replace('item_',''),10);const source=currentChecklist.type==='observation'?currentChecklist.quickCheck:currentChecklist.items;data.responses.push({item:source[idx],response:value})}else data.fields[key]=value}const photos=document.getElementById('photos');data.fileCount=photos&&photos.files?photos.files.length:0;return data}
function validateBeforeSubmit(){const errors=[],company=document.getElementById('company'),other=document.getElementById('otherCompany'),photos=document.getElementById('photos'),corrective=document.getElementById('correctiveAction');if(!company.value)errors.push('Company / Trade Partner is required.');if(company.value==='Other'&&!other.value.trim())errors.push('Enter Company Name is required when Other is selected.');if(hasNegativeFinding()){if(!corrective.value.trim())errors.push('Corrective action is required for negative findings.');if(!photos.files||photos.files.length===0)errors.push('At least one photo is required for negative findings.')}return errors}
async function handleSubmit(event){event.preventDefault();const form=event.target,errors=validateBeforeSubmit(),errorBox=document.getElementById('formErrors'),successBox=document.getElementById('formSuccess');errorBox.classList.add('hidden');successBox.classList.add('hidden');if(!form.checkValidity()||errors.length){form.reportValidity();if(errors.length){errorBox.innerHTML=errors.map(e=>`<div>${e}</div>`).join('');errorBox.classList.remove('hidden')}return}const payload=collectFormData(form);if(!SUBMISSION_ENDPOINT){const key='jedunn_safety_checklist_test_submissions';const existing=JSON.parse(localStorage.getItem(key)||'[]');existing.push(payload);localStorage.setItem(key,JSON.stringify(existing));successBox.innerHTML='Submission captured for front-end testing. Backend dashboard connection is not configured yet.';successBox.classList.remove('hidden');form.querySelector('.submit-btn').disabled=true;return}try{const response=await fetch(SUBMISSION_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error('Submission failed.');successBox.innerHTML='Submission successful. Thank you. Your checklist has been submitted.';successBox.classList.remove('hidden');form.reset()}catch(err){errorBox.textContent='Submission could not be completed. Please notify Safety.';errorBox.classList.remove('hidden')}}
initHub();
</script>
  
<script src="microsoft-backend.js"></script>
  
</body>
</html>
